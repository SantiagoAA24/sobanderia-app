name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: sobanderia
          POSTGRES_PASSWORD: sobanderia
          POSTGRES_DB: sobanderia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sobanderia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sobanderia:sobanderia@localhost:5432/sobanderia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - run: make check

  e2e:
    # Recorridos de Playwright a 390x844. Pasan tres veces seguidas, cada una con la base reiniciada.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: sobanderia
          POSTGRES_PASSWORD: sobanderia
          POSTGRES_DB: sobanderia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sobanderia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sobanderia:sobanderia@localhost:5432/sobanderia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup
      - run: cd apps/web && npx playwright install --with-deps chromium
      - run: cd apps/web && npm run build
      - name: Recorridos (3 corridas seguidas)
        run: |
          cd apps/web
          for corrida in 1 2 3; do
            echo "== corrida $corrida"
            npx playwright test
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
