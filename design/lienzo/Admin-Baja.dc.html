.day-chip{min-height:64px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--ink);text-decoration:none}
