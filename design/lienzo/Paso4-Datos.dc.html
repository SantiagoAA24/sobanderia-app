<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paso 4 · Sus datos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sobanderia/tokens.css">
<link rel="stylesheet" href="ds/sobanderia/components/bundle.css">
<script src="ds/sobanderia/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
input:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.cta .sb-button{width:100%}
.proto-link{display:block;text-decoration:none;color:inherit;border-radius:var(--radius-lg)}
.proto-link button{pointer-events:none}
.proto-back{position:absolute;left:var(--space-20);top:var(--space-24);width:110px;height:48px;border-radius:var(--radius-lg)}
.proto-link:focus-visible,.proto-back:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">

<div style="position: relative; padding: var(--space-24) var(--space-20) 0">
<x-import component-from-global-scope="Sobanderia.StepHeader" step="4"></x-import>
<a class="proto-back" href="Paso3-Hora.dc.html" aria-label="Atrás"></a>
</div>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-16) var(--space-20) 0; display: flex; flex-direction: column; gap: var(--space-16)">
<h1 class="display-lg" style="margin: 0">Sus datos</h1>

<x-import component-from-global-scope="Sobanderia.SummaryCard" items="{{ items }}"></x-import>

<x-import component-from-global-scope="Sobanderia.TextField" label="Nombre completo" type="text" value="María Gómez" id="nombre" onChange="{{ noop }}" autoComplete="name"></x-import>

<x-import component-from-global-scope="Sobanderia.TextField" label="Número de celular" type="tel" value="300 123 4567" id="celular" onChange="{{ noop }}" inputMode="tel" autoComplete="tel" helper="Le enviaremos la confirmación por WhatsApp."></x-import>

<x-import component-from-global-scope="Sobanderia.CheckboxField" id="datos" label="Acepto el tratamiento de mis datos personales." linkText="Ver política" defaultChecked="{{ yes }}"></x-import>
</main>

<div style="padding: var(--space-16) var(--space-20) var(--space-24)">
<a class="proto-link" href="Confirmada.dc.html"><div class="cta"><x-import component-from-global-scope="Sobanderia.Button" variant="solid" icon="check">Confirmar cita</x-import></div></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { noop: () => {}, yes: true, items: [{ icon: 'users', text: 'Con Carlos' }, { icon: 'calendar-check', text: 'Viernes 13 de noviembre' }, { icon: 'clock', text: '10:30 a. m. · 30 min' }] };
}
}
</script>
</body>
</html>
