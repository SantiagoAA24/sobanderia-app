<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sobandero · Cambiar la hora</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/sobanderia/tokens.css">
<link rel="stylesheet" href="ds/sobanderia/components/bundle.css">
<script src="ds/sobanderia/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.cta .sb-button{width:100%}
.proto-link{display:block;text-decoration:none;color:inherit;border-radius:var(--radius-lg)}
.proto-link button{pointer-events:none}
.proto-link:focus-visible,.nav-a:focus-visible,.back-over:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.avatar-over{position:absolute;right:var(--space-20);top:28px;width:48px;height:48px;border-radius:50%}
.avatar-over:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
.proto-back{position:absolute;left:var(--space-20);top:var(--space-24);width:110px;height:48px;border-radius:var(--radius-lg)}
.navwrap{position:relative}
.nav-a{position:absolute;top:0;bottom:0;width:25%;border-radius:var(--radius-md)}
.back-over{position:absolute;left:var(--space-20);top:var(--space-16);width:110px;height:48px;border-radius:var(--radius-lg)}
.back-link-old{align-self:flex-start;min-height:48px;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-8) 0 0;color:var(--brand-deep);text-decoration:none;border-radius:var(--radius-lg)}
.day-chip{min-height:64px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-lg);color:var(--ink);text-decoration:none}
.day-chip--on{background:var(--surface-clay-tint);border:2px solid var(--brand-deep);color:var(--brand-deep)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-100); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<div style="position: relative; padding: var(--space-16) var(--space-20) 0; display: flex"><x-import component-from-global-scope="Sobanderia.BackHeader"></x-import><a class="back-over" href="Cita.dc.html" aria-label="Atrás"></a></div>
<main style="flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-16) var(--space-20) var(--space-16); display: flex; flex-direction: column; gap: var(--space-16)">
<h1 class="display-lg" style="margin: 0">Cambiar la hora</h1>
<x-import component-from-global-scope="Sobanderia.SummaryCard" items="{{ items }}"></x-import>
<section aria-label="Día" style="display: flex; flex-direction: column; gap: var(--space-10)"><h2 class="section-title" style="margin: 0">Día</h2>
<x-import component-from-global-scope="Sobanderia.OptionRow" title="Hoy, jueves 12" trailing="radio" selected="{{ no }}"></x-import>
<x-import component-from-global-scope="Sobanderia.OptionRow" title="Mañana, viernes 13" trailing="radio" selected="{{ yes }}"></x-import>
</section>
<section aria-label="Hora" style="display: flex; flex-direction: column; gap: var(--space-10)"><h2 class="section-title" style="margin: 0">Hora</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-10)"><x-import component-from-global-scope="Sobanderia.TimeSlot" time="9:00" meridiem="a. m."></x-import><x-import component-from-global-scope="Sobanderia.TimeSlot" time="10:30" meridiem="a. m." selected="{{ yes }}"></x-import><x-import component-from-global-scope="Sobanderia.TimeSlot" time="11:00" meridiem="a. m."></x-import><x-import component-from-global-scope="Sobanderia.TimeSlot" time="2:00" meridiem="p. m."></x-import><x-import component-from-global-scope="Sobanderia.TimeSlot" time="2:30" meridiem="p. m."></x-import><x-import component-from-global-scope="Sobanderia.TimeSlot" time="3:30" meridiem="p. m."></x-import></div></section>
<x-import component-from-global-scope="Sobanderia.CheckboxField" id="avisar" label="Avisarle por WhatsApp" defaultChecked="{{ yes }}"></x-import>
</main>
<div style="display: flex; flex-direction: column; gap: var(--space-10); padding: var(--space-16) var(--space-20) var(--space-24)">
<a class="proto-link cta" href="Hoy.dc.html"><x-import component-from-global-scope="Sobanderia.Button" variant="solid" icon="check">Guardar cambio</x-import></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true, no: false, noop: () => {}, items: [{ icon: 'users', text: 'Luz Dary Pineda' }, { icon: 'calendar-check', text: 'Hoy · 9:30 a. m.' }, { icon: 'clock', text: '30 min' }] };
}
}
</script>
</body>
</html>
