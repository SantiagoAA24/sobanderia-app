<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--surface-100);color:var(--ink)}</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var S = window.Sobanderia, h = React.createElement;
  var view = h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-10)', maxWidth: 350 } },
    h('h2', { className: 'section-title', style: { margin: 0 } }, 'Más tarde hoy'),
    h(S.AppointmentRow, { time: '10:30', meridiem: 'a. m.', name: 'Hernán Castaño' }),
    h(S.AppointmentRow, { time: '11:00', meridiem: 'a. m.', name: 'Rosa Elvira Torres' }),
    h(S.AppointmentRow, { time: '2:00', meridiem: 'p. m.', name: 'Álvaro Ruiz' }));
  ReactDOM.createRoot(document.getElementById('root')).render(view);
})();
</script>
</body>
</html>
