<!-- @dsCard group="Acciones" height=260 subtitle="solid, outline y onBrand" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--surface-100);color:var(--ink)}</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var S = window.Sobanderia, h = React.createElement;
  var row = { display: 'flex', gap: 'var(--space-10)', maxWidth: 342 };
  var view = h('div', { style: { display: 'flex', flexDirection: 'column', gap: 'var(--space-16)', maxWidth: 342 } },
    h('div', { style: row },
      h(S.Button, { icon: 'plus', style: { flex: 1 } }, 'Nueva cita'),
      h(S.Button, { variant: 'outline', style: { flex: 1 } }, 'Bloquear horas')),
    h('div', { style: { background: 'var(--brand)', borderRadius: 'var(--radius-xl)', padding: 'var(--space-20)' } },
      h('div', { style: row },
        h(S.Button, { variant: 'onBrand', size: 'md', icon: 'phone', style: { flex: 1 } }, 'Llamar'),
        h(S.Button, { variant: 'onBrand', size: 'md', icon: 'chat', style: { flex: 1 } }, 'WhatsApp'))));
  ReactDOM.createRoot(document.getElementById('root')).render(view);
})();
</script>
</body>
</html>
