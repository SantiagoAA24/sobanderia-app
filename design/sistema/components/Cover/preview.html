<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: var(--surface-100); }
.cover { display: block; width: 960px; height: 288px; }
.ground { fill: var(--surface-100); }
.brand { fill: var(--brand); }
.deep { fill: var(--brand-deep); }
.ink { fill: var(--ink); }
.sand { fill: var(--surface-sand); }
.green { fill: var(--success); }
.r-xl { rx: var(--radius-xl); }
.name { font-family: var(--font-display); font-weight: 700; font-size: 76px; fill: var(--ink); }
.tag { font-family: var(--font-sans); font-weight: 400; font-size: 14px; fill: var(--ink-muted); }
</style>
</head>
<body>
<svg class="cover" viewBox="0 0 960 288" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sobandería">
<!--
Bloques: brand 264x216 (sangra arriba), ink 168x168, brand-deep 216x96 (sangra abajo), surface-sand 216x96 (sangra abajo); lados y gaps en pasos de 24 (space-24), esquinas radius-xl.
Disposición: losa terracota arriba-izquierda de la zona, bloque de tinta a su derecha, dos bandas inferiores desalineadas.
Patrón: discos y píldoras; el negocio es cercano y de formas suaves (radios grandes), así que el patrón sale de círculos y píldoras cortadas del radio.
Pasos y radios: pitch 48 (2 x space-24), discos r=10, píldoras con rx = mitad de su lado corto (24 y 16), esquinas rx=24 (radius-xl).
-->
<rect class="brand r-xl" x="480" y="-24" width="264" height="216" rx="24"/>
<circle class="ground" cx="512" cy="40" r="10"/>
<circle class="ground" cx="560" cy="40" r="10"/>
<circle class="ground" cx="608" cy="40" r="10"/>
<circle class="ground" cx="656" cy="40" r="10"/>
<circle class="ground" cx="704" cy="40" r="10"/>
<circle class="ground" cx="512" cy="88" r="10"/>
<circle class="ground" cx="560" cy="88" r="10"/>
<circle class="ground" cx="608" cy="88" r="10"/>
<circle class="ground" cx="656" cy="88" r="10"/>
<circle class="ground" cx="704" cy="88" r="10"/>
<circle class="ground" cx="512" cy="136" r="10"/>
<circle class="ground" cx="560" cy="136" r="10"/>
<circle class="ground" cx="608" cy="136" r="10"/>
<circle class="ground" cx="656" cy="136" r="10"/>
<circle class="ground" cx="704" cy="136" r="10"/>
<rect class="ink r-xl" x="768" y="24" width="168" height="168" rx="24"/>
<rect class="brand" x="792" y="48" width="120" height="48" rx="24"/>
<circle class="sand" cx="816" cy="144" r="24"/>
<rect class="deep r-xl" x="480" y="216" width="216" height="96" rx="24"/>
<rect class="sand r-xl" x="720" y="216" width="216" height="96" rx="24"/>
<rect class="green" x="744" y="240" width="72" height="32" rx="16"/>
<text class="name" x="48" y="214">Sobandería</text>
<text class="tag" x="48" y="248">Citas claras, sin complicaciones.</text>
</svg>
</body>
</html>
