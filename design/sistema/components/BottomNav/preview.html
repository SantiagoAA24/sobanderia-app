<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px 0;background:var(--surface-100);color:var(--ink)}</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var S = window.Sobanderia, h = React.createElement;
  function Demo() {
    var state = React.useState('today');
    return h('div', { style: { maxWidth: 390 } },
      h(S.BottomNav, { active: state[0], onSelect: state[1] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
})();
</script>
</body>
</html>
