<!-- @dsCard group="Agendar" height=380 subtitle="Etiqueta visible y ayuda" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:24px;background:var(--surface-100);color:var(--ink)}</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var S = window.Sobanderia, h = React.createElement;
  var view = h('div', { style: { maxWidth: 350, display: 'flex', flexDirection: 'column', gap: 'var(--space-16)' } },
    h(S.TextField, { label: 'Nombre completo', defaultValue: 'María Gómez', autoComplete: 'name' }),
    h(S.TextField, { label: 'Número de celular', type: 'tel', inputMode: 'tel', autoComplete: 'tel', defaultValue: '300 123 4567', helper: 'Le enviaremos la confirmación por WhatsApp.' }),
    h(S.TextField, { label: 'Número de celular', type: 'tel', inputMode: 'tel', id: 'cel-err', defaultValue: '300 12', error: 'Escriba los 10 dígitos de su celular.' }));
  ReactDOM.createRoot(document.getElementById('root')).render(view);
})();
</script>
</body>
</html>
